<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track a Ticket | MedQueue</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="assets/logo.jpg">
</head>
<body>

  <div class="app-container">
    <header class="header">
      <div class="container nav-container">
        <a href="index.html" class="brand">
          <img src="assets/logo.jpg" alt="MedQueue Logo" class="logo-icon-img">
          <div class="brand-text">
            <span class="brand-main">MedQueue</span>
            <span class="brand-sub">Priority Triage System</span>
          </div>
        </a>
        <nav class="nav-links" id="header-nav">
          <a href="login.html" class="nav-link">Login</a>
          <a href="signup.html" class="btn btn-primary btn-sm">Get Started</a>
        </nav>
      </div>
    </header>

    <main class="main-content auth-wrapper">
      <div style="width: 100%; max-width: 500px;">
        <div style="text-align: center; margin-bottom: 32px;">
          <h1 style="font-size: 2.2rem; margin-bottom: 8px;">Track a Ticket</h1>
          <p style="color: var(--text-muted); font-size: 0.95rem;">Enter your ticket number to check your queue position without signing in.</p>
        </div>

        <div class="card-panel no-hover" style="margin-bottom: 24px;">
          <form id="lookup-form">
            <div class="form-group">
              <label class="form-label" for="ticket-input">Ticket Number</label>
              <input type="text" id="ticket-input" class="form-input" placeholder="e.g. TKT-1724" maxlength="8" style="text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; font-size: 1.1rem; text-align: center;" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Look Up</button>
          </form>
        </div>

        <div id="lookup-result" class="hidden">
          <!-- Populated by JS -->
        </div>
      </div>
    </main>

    <div id="site-footer"></div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/queue.js"></script>
  <script src="js/page-lookup.js"></script>
</body>
</html>
