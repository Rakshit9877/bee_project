<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Dashboard | MedQueue</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="assets/logo.jpg">
</head>
<body>

  <div class="app-container">
    <header class="header">
      <div class="container nav-container">
        <a href="index.html" class="brand">
          <img src="assets/logo.jpg" alt="MedQueue Logo" class="logo-icon-img">
          <div class="brand-text">
            <span class="brand-main">MedQueue</span>
            <span class="brand-sub">Priority Triage System</span>
          </div>
        </a>
        <div class="nav-right" id="header-nav"></div>
      </div>
    </header>

    <main class="main-content container" style="padding-top: 40px; padding-bottom: 60px;">

      <div style="display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 20px; margin-bottom: 24px;">
        <div>
          <h1 style="font-size: 2.2rem; margin: 0;">Live Triage Queue</h1>
        </div>
        
        <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
          <div class="queue-pill">
            <span class="pulse-dot"></span>
            Auto-refreshing
          </div>
          <div class="queue-pill" style="background: var(--triage-routine-bg); border-color: rgba(56, 142, 60, 0.2);">
            Waiting: <strong id="count-waiting">0</strong>
          </div>
          <div class="queue-pill" style="background: var(--bg-card);">
            Served: <strong id="count-served">0</strong>
          </div>
          <button id="call-next-btn" class="btn btn-coral">
            Call Next Patient
          </button>
        </div>
      </div>

      <div class="card-panel no-hover" style="padding: 0; overflow: hidden; margin-bottom: 40px;">
        <div style="overflow-x: auto;">
          <table id="queue-table">
            <thead>
              <tr>
                <th>#</th>
                <th>Ticket</th>
                <th>Patient</th>
                <th>Priority Score</th>
                <th>Onset</th>
                <th>Symptoms &amp; Flags</th>
                <th>Registered</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="queue-tbody">
            </tbody>
          </table>
        </div>

        <div id="empty-state" style="display:none; padding: 60px 20px; text-align: center;">
          <div class="feature-icon purple" style="margin: 0 auto 16px auto; width: 56px; height: 56px; font-size: 1.5rem; border-radius: 50%;">Q</div>
          <h3 style="font-size: 1.5rem; margin-bottom: 8px;">Queue is empty</h3>
          <p style="color: var(--text-muted);">No patients have checked in yet.</p>
        </div>
      </div>

      <!-- Served patients section -->
      <div id="served-section" class="hidden">
        <h2 style="font-size: 1.1rem; color: var(--text-muted); margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.05em;">
          Served Today
        </h2>
        <div class="card-panel no-hover" style="padding: 0; overflow: hidden; opacity: 0.7;">
          <div style="overflow-x: auto;">
            <table id="served-table">
              <thead>
                <tr>
                  <th>Ticket</th>
                  <th>Patient</th>
                  <th>Score</th>
                  <th>Symptoms</th>
                  <th>Registered</th>
                </tr>
              </thead>
              <tbody id="served-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>

    </main>

    <div id="site-footer"></div>
  </div>

  <div id="toast-container"></div>

  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/queue.js"></script>
  <script src="js/page-dashboard.js"></script>
</body>
</html>
